services:
  # Database Tier: MongoDB
  mongodb:
    image: mongo:8
    container_name: task-platform-mongodb
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - task-platform-mongo-data:/data/db
    networks:
      - task-platform-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --port 27017 --eval \"quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)\""]
      interval: 10s
      timeout: 35s
      retries: 5
      start_period: 30s

  # Backend Tier: Node.js + Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task-platform-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MONGO_URI: mongodb://mongodb:27017/task_platform
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - task-platform-network

  # Frontend Tier: React + Vite (Served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task-platform-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # In a browser-based SPA, API calls execute inside the user's browser on the host machine.
      # The browser communicates with the backend via the host-published port (http://localhost:8080),
      # rather than the internal Docker network name (http://backend:8080).
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
    networks:
      - task-platform-network

# Named volume for MongoDB persistence
volumes:
  task-platform-mongo-data:

# Private network for container-to-container communication
networks:
  task-platform-network:
    driver: bridge
